[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "librus-telegram-digest"
version = "1.0.0"
description = "Daily Librus Synergia digest (grades, absences, messages, timetable) delivered to Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["librus-apix>=1.6,<2", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
librus-digest = "librus_digest.cli:main"

[tool.setuptools]
packages = ["librus_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
